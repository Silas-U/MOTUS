# Generated by Motus Builder. object_types below are the shared Motus
# sim prop catalog (unrelated to which robot is imported) -- copied
# verbatim from robokpy_controller's own config/objects.yaml. Only the
# gripper: section is robot-specific.
gripper:
  parent_model: arm1_robot        # matches cell.launch.py's single-arm spawn-entity naming
                                   # convention (namespace + '_robot'); update this if the
                                   # project is ever run in multi-arm mode under a different
                                   # namespace.
  parent_link: joint6_flange   # last link reached via a movable joint -- see comment
                                   # above config_generator.py's catalog_parent_link. Confirm
                                   # against a real `gz model -m arm1_robot -l` if attach poses
                                   # ever look wrong; fixed-joint reduction can occasionally
                                   # surprise you.
  approach_offset: 0.0            # NOT calibrated for this robot/gripper -- robokpy_controller's
                                   # own default (0.0507) is an empirically-measured constant
                                   # specific to the UR5e + Robotiq 2F-85 combo and would be
                                   # actively wrong here. Leave at 0.0 (no offset) until this
                                   # robot's actual gripper geometry is measured the same way
                                   # (see robokpy_controller/config/objects.yaml's comment for
                                   # the calibration method).

object_types:
  cube_small:
    child_link: link
    geometry:
      shape: box
      size: [0.03, 0.03, 0.03]
      mass: 0.005
    max_instances: 6

  cube_large:
    child_link: link
    geometry:
      shape: box
      size: [0.05, 0.05, 0.05]
      mass: 0.015
    max_instances: 4
