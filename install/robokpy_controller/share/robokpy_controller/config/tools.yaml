gripper_1:
  backend: gripper_action
  action_name: /gripper_action_controller/gripper_cmd
  joint_name: robotiq_85_left_knuckle_joint
  open_position: 0.001
  closed_position: 0.154
  max_effort: 5.0
  action_timeout: 5.0


gripper_2:
  backend: gripper_action
  action_name: /gripper_action_controller/gripper_cmd
  joint_name: right_finger_joint
  open_position: 0.0015
  closed_position: 0.035
  max_effort: 5.0
  action_timeout: 5.0

vacuum_1:
  backend: mock
  open_delay: 0.3
  close_delay: 0.5

pneumatic_0:
  backend: digital_io
  pin_open: 17
  pin_close: 27
  feedback_pin: 22
  open_state: high
  pulse_ms: 100

robotiq_85:
  backend: modbus
  host: 192.168.1.11
  port: 502
  register_cmd: 0
  value_open: 0
  value_close: 255

pneumatic_1:
  backend: mock
  open_delay: 0.1
  close_delay: 0.1

vacuum_2:
  backend: ros_topic
  topic: /vacuum_controller/cmd
  on_value: on
  off_value: off

mock:
  backend: mock
  on_delay: 0.5  # simulated machining cycle time (seconds)
  off_delay: 0.5
grasp_attach_1:
  backend: grasp_attach
  service_name: /grasp_attach
  service_timeout: 5.0
  # parent_model / parent_link / objects_catalog_path intentionally
  # omitted — injected at launch time from objects.yaml (single source
  # of truth, see motus_ur5e_robotiq_85_launch.py and object_catalog.py)

  # Object catalog — lets ParallelJawActuator scale grip-close distance
  # to the target object's size instead of always fully closing.
  # Ignored entirely if gripper_mechanism is 'suction'.

  # Which GraspActuator drives the physical gripper — swap this one
  # line (+ the matching keys below) to change gripper hardware
  # without touching tool_action_server.py. Options: parallel_jaw, suction.
  gripper_mechanism: parallel_jaw

  # --- parallel_jaw keys (used when gripper_mechanism: parallel_jaw) ---
  gripper_action_name: /gripper_action_controller/gripper_cmd
  gripper_joint_name: robotiq_85_left_knuckle_joint
  gripper_open_position: 0.001
  # MATCHES gripper_1.closed_position (0.154) — the real joint limit.
  # Previously 0.554 caused controller saturation, wiping out the
  # size-dependent scaling.
  gripper_closed_position: 0.154
  gripper_max_effort: 50.0
  gripper_action_timeout: 5.0
  # Lowered from 0.7 → 0.3 so the visible finger spread between
  # cube_large (0.05 m) and cube_small (0.03 m) is ~0.04 rad
  # (~2.5°) instead of ~0.02 rad.
  gripper_min_close_ratio: 0.3

  # --- suction keys (used when gripper_mechanism: suction) ---
  # vacuum_topic: /vacuum_controller/cmd
  # vacuum_on_value: on
  # vacuum_off_value: off