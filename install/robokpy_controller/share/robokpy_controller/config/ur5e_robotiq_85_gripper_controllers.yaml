/**/controller_manager:
  ros__parameters:
    update_rate: 125  # Hz — 1:1 with 0.008s physics step (motus_world.sdf)

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_action_controller:
      type: parallel_gripper_action_controller/GripperActionController

/**/joint_state_broadcaster:
  ros__parameters: {}

/**/arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
      - velocity
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    # allow_nonzero_velocity_at_trajectory_start: true
    # allow_nonzero_velocity_at_trajectory_end: true
    # allow_trajectory_replacement: true
    # interpolate_from_desired_state: true
# =========================================================
# Robotiq 2F-85 — native mimic architecture.
# Only the primary joint (robotiq_85_left_knuckle_joint) is
# commanded, via position. The other 7 joints are driven
# purely by the URDF <mimic> tags (native gz_ros2_control
# mimic support).
# =========================================================
/**/gripper_action_controller:
  ros__parameters:
    joint: robotiq_85_left_knuckle_joint
    action_monitor_rate: 20.0
    goal_tolerance: 0.01
    allow_stalling: true
    stall_velocity_threshold: 0.001
    stall_timeout: 0.3
    max_effort: 5.0