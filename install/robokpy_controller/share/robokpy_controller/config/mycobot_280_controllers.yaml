controller_manager:
  ros__parameters:
    update_rate: 125  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters: {}

arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6_to_joint6_flange
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    interpolation_method: splines
    allow_nonzero_velocity_at_trajectory_start: true
    allow_partial_joints_goal: false
    allow_integration_in_goal_trajectories: false
    open_loop_control: false
    action_monitor_rate: 20.0
    state_publish_rate: 50.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 1.0
      joint2_to_joint1:       { trajectory: 0.05, goal: 0.03 }
      joint3_to_joint2:       { trajectory: 0.05, goal: 0.03 }
      joint4_to_joint3:       { trajectory: 0.05, goal: 0.03 }
      joint5_to_joint4:       { trajectory: 0.05, goal: 0.03 }
      joint6_to_joint5:       { trajectory: 0.05, goal: 0.03 }
      joint6_to_joint6_flange: { trajectory: 0.05, goal: 0.03 }
    cmd_timeout: 2.0
