/**:
  ros__parameters:
    world_frame: world

motion_planner:
  ros__parameters:
    default_traj_type: lspb
    default_traj_method: js
    default_speed_factor: 1.0
    default_duration_per_segment: 1.0
    default_dt: 0.04
    default_blend_radius: 0.0
    default_n_samples: 50
    default_n_blend: 0
    enable_limit_check: True
    enable_continuity_check: True
    abort_on_limit_violation: False
    mask: [1, 1, 1, 1, 1, 1]

kinematic_solver:
  ros__parameters:
    mask: [1, 1, 1, 1, 1, 1]
    control_rate_hz: 50.0
    pose_rate_limit_hz: 50.0

robot_state_manager:
  ros__parameters:
    publish_rate_hz: 50.0
    state_timeout_s: 1.0

robot_state_interface_virtual:
  ros__parameters:
    publish_rate_hz: 50.0

robot_command_server:
  ros__parameters:
    default_gripper_tool_id: gripper_1
