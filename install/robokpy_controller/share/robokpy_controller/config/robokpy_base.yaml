/**:
  ros__parameters:
    world_frame: world

    # ------------------------------------------------------------
    # Trajectory behaviour
    # ------------------------------------------------------------
    default_traj_type: scurve
    default_traj_method: js

    default_speed_factor: 1.0

    # Keep this as a fallback only.
    default_duration_per_segment: 3.0

    # 25 Hz is enough for trajectory waypoint generation.
    # The controller/Gazebo loop can still run faster.
    default_dt: 0.04

    default_blend_radius: 0.0

    # Fewer trajectory samples = less memory + less interpolation work.
    # 50 -> 30 is a reasonable first reduction.
    default_n_samples: 10

    cartesian_vel_limit: 0.25

    # Reduce LSPB/SCurve blending computation.
    # 20 -> 10 is normally a good compromise.
    default_n_blend: 20

    # ------------------------------------------------------------
    # Safety / diagnostics
    # ------------------------------------------------------------
    enable_limit_check: True

    # Already disabled; keep this off.
    enable_continuity_check: False

    # Avoid unnecessary abort/recovery work.
    abort_on_limit_violation: False

    # If validation is only being used for debugging, disable it
    # during normal execution.
    enable_trajectory_validation: False

    mask: [1, 1, 1, 1, 1, 1]


kinematic_solver:
  ros__parameters:
    mask: [1, 1, 1, 1, 1, 1]
    control_rate_hz: 100.0
    pose_rate_limit_hz: 100.0


robot_state_manager:
  ros__parameters:
    publish_rate_hz: 100.0
    state_timeout_s: 1.0


robot_state_interface_virtual:
  ros__parameters:
    publish_rate_hz: 100.0


robot_command_server:
  ros__parameters:
    default_gripper_tool_id: gripper_1