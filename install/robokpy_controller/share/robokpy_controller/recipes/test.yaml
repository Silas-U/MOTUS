recipe_id: p2p_single_move_js

# Minimal single point-to-point move: one leg, joint-space (js).
# Point A is implicit — wherever the arm currently is when this runs.
# Point B is the one target_pose below. No blending, no grouping, no
# tool/spawn steps — a clean baseline: one plan, one JTC goal.

steps:

- id: move_a_to_b
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.40, y: 0.20, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  depends_on: []