recipe_id: pick_place_multi_station_v1

# Layout (all poses tool-down: qx=0, qy=1, qz=0, qw=0):
#   Station A (pick)  : x=0.40, y= 0.10   — infeed bin
#   Station B (place)  : x=0.40, y=-0.30   — outfeed conveyor
#   Station C (pick)  : x=0.55, y= 0.10   — second infeed bin
#   Station D (place)  : x=0.55, y=-0.30   — second outfeed conveyor
# Approach/retract height z=0.30, pick/place contact height z=0.15

steps:

  # ===================== CYCLE 1: Station A -> Station B =====================

  - id: traverse_to_a
    type: move
    traj_method: js       # movej — fast joint-space traverse, path shape doesn't matter here
    target_pose: {x: 0.40, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: []

  - id: descend_pick_a
    type: move
    traj_method: ts       # movel — straight-line descent for a controlled approach
    target_pose: {x: 0.40, y: 0.10, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0     # precise stop at the pick point
    speed_scale: 0.5
    depends_on: [traverse_to_a]

  - id: grip_close_a
    type: tool
    tool_id: gripper_1
    command: close
    # start closing before the descent fully stops
    depends_on:
      - {progress: descend_pick_a, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_a
    type: move
    traj_method: ts       # movel — straight back out the way it came in
    target_pose: {x: 0.40, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_close_a]

  - id: traverse_to_b
    type: move
    traj_method: js       # movej — long traverse across the cell to the outfeed side
    target_pose: {x: 0.40, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: [retract_a]

  - id: blowoff_b
    type: io
    io_id: pneumatic_1
    command: "on"
    # quick air blow-off before placing — fires as soon as the traverse
    # is basically done, doesn't need to wait for grip actions
    depends_on:
      - {progress: traverse_to_b, threshold: 0.9}

  - id: blowoff_b_off
    type: io
    io_id: pneumatic_1
    command: "off"
    depends_on: [blowoff_b]

  - id: descend_place_b
    type: move
    traj_method: ts       # movel — controlled descent to place
    target_pose: {x: 0.40, y: -0.30, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [blowoff_b_off, traverse_to_b]

  - id: grip_open_b
    type: tool
    tool_id: gripper_1
    command: open
    depends_on:
      - {progress: descend_place_b, threshold: 0.85}
    recovery: retry
    max_retries: 2
    # placement is the critical hand-off point in this cycle — if the
    # release itself fails even after retries, stop and get a human
    # rather than silently continuing with an uncertain part state.

  - id: retract_b
    type: move
    traj_method: ts
    target_pose: {x: 0.40, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_open_b]
    recovery: hold_for_operator

  # ===================== CYCLE 2: Station C -> Station D =====================

  - id: traverse_to_c
    type: move
    traj_method: js
    target_pose: {x: 0.55, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: [retract_b]

  - id: descend_pick_c
    type: move
    traj_method: ts
    target_pose: {x: 0.55, y: 0.10, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [traverse_to_c]

  - id: grip_close_c
    type: tool
    tool_id: gripper_1
    command: close
    depends_on:
      - {progress: descend_pick_c, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_c
    type: move
    traj_method: ts
    target_pose: {x: 0.55, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_close_c]

  - id: traverse_to_d
    type: move
    traj_method: js
    target_pose: {x: 0.55, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: [retract_c]

  - id: descend_place_d
    type: move
    traj_method: ts
    target_pose: {x: 0.55, y: -0.30, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [traverse_to_d]

  - id: grip_open_d
    type: tool
    tool_id: gripper_1
    command: open
    depends_on:
      - {progress: descend_place_d, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_d
    type: move
    traj_method: ts
    target_pose: {x: 0.55, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_open_d]

  # ===================== CYCLE COMPLETE =====================

  - id: cycle_settle
    type: wait
    duration_sec: 0.5
    depends_on: [retract_d]