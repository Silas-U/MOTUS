recipe_id: grasp_attach_pipeline_stack_4_v1_industrial_fast

# INDUSTRIAL MOTION PROFILE — MAXIMUM MERGE
#   js = PTP (joint-space)   — fast transit
#   ts = LIN (task-space)    — straight-line precision
#
# DAG optimized so every retract→traverse→descend sequence merges
# into a single ExecuteMotion goal. The arm never stops between
# pick and place — only pauses for the gripper tool steps.

steps:

# ============================================================================
# SPAWN (background — no dependents, completes before arm arrives)
# ============================================================================

- id: spawn_target_1
  type: spawn
  operation: spawn
  type_id: cube_small
  x: 0.40
  y: 0.10
  z: 0.015
  qw: 1.0
  color: red
  depends_on: []

- id: spawn_target_2
  type: spawn
  operation: spawn
  type_id: cube_small
  x: 0.40
  y: 0.22
  z: 0.015
  qw: 1.0
  color: green
  depends_on: []

- id: spawn_target_3
  type: spawn
  operation: spawn
  type_id: cube_small
  x: 0.40
  y: 0.34
  z: 0.015
  qw: 1.0
  color: blue
  depends_on: []

- id: spawn_target_4
  type: spawn
  operation: spawn
  type_id: cube_small
  x: 0.40
  y: 0.46
  z: 0.015
  qw: 1.0
  color: yellow
  depends_on: []

# ============================================================================
# INITIALIZATION
# ============================================================================

- id: move_home
  type: move
  traj_method: js
  target_pose:
    {x: 0.45, y: 0.00, z: 0.45, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  depends_on: [spawn_target_1]

# ============================================================================
# CUBE 1
# ============================================================================

- id: traverse_to_a_1
  type: move
  traj_method: js
  target_pose:
    {x: 0.35, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.10
  depends_on: [move_home]

- id: descend_pick_a_1
  type: move
  traj_method: ts
  from_spawn_step: spawn_target_1
  target_pose:
    {qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.0
  depends_on: [traverse_to_a_1]

- id: grip_close_a_1
  type: tool
  tool_id: grasp_attach_1
  command: "attach:cube_small_1"
  recovery: retry
  max_retries: 2
  depends_on: [descend_pick_a_1]

- id: retract_a_1
  type: move
  traj_method: ts
  target_pose:
    {x: 0.35, y: 0.10, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.10
  depends_on: [grip_close_a_1]

- id: traverse_to_b_1
  type: move
  traj_method: js
  target_pose:
    {x: 0.40, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.10
  depends_on: [retract_a_1]

- id: descend_place_b_1
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: -0.30, z: 0.0657, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.0
  depends_on: [traverse_to_b_1]

- id: release_b_1
  type: tool
  tool_id: grasp_attach_1
  command: release
  recovery: retry
  max_retries: 2
  depends_on: [descend_place_b_1]

- id: retract_b_1
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: -0.30, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.10
  depends_on: [release_b_1]

