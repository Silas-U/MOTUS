recipe_id: scattered_four_cube_stack_auto_orient_v3_moves_only

# Move-only companion to test4.yaml — same waypoint pattern, traj
# methods, and blend_radius values, with all spawn/tool steps removed
# so this exercises just the motion pipeline (planning, blending,
# JTC dispatch) for repeatable testing, independent of grasp_attach/
# object_spawner.
#
# The four descend_pick_a_N legs used from_spawn_step +
# use_spawn_orientation in test4.yaml, which only resolve against a
# spawn step's own assigned pose — with no spawn step here, those are
# replaced with explicit target_pose values: each spawn step's own
# x/y from test4.yaml, a generic pick height (z=0.05), and the same
# gripper-down orientation (qx=0, qy=1, qz=0, qw=0) used everywhere
# else in the file. Not meant to reproduce exact grasp accuracy —
# there's no object here to actually grasp — just a reachable,
# non-degenerate pose in the right place.

steps:

# ============================================================================
# INITIALIZATION
# ============================================================================

- id: move_home
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.45, y: 0.00, z: 0.45, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  depends_on: []

# ============================================================================
# CUBE 3 slot — blue, LARGE, picked 1st, placed at base of stack
# ============================================================================

- id: traverse_to_a_3
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.36, y: 0.40, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [move_home]

- id: descend_pick_a_3
  type: move
  traj_method: ts
  target_pose:
    {x: 0.36, y: 0.40, z: 0.05, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.0
  depends_on: [traverse_to_a_3]

- id: retract_a_3
  type: move
  traj_method: ts
  target_pose:
    {x: 0.36, y: 0.40, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [descend_pick_a_3]

- id: traverse_to_b_3
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.40, y: -0.35, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [retract_a_3]

- id: descend_place_b_3
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: -0.35, z: 0.0757, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.0
  depends_on: [traverse_to_b_3]

- id: retract_b_3
  type: move
