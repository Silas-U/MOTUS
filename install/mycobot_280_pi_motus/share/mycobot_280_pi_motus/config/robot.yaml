# Generated by Motus Builder -- same shape as robokpy_controller's
# config/robots/<arm_type>.yaml. Filled in once `motus robot add` has run
# kinematic_analyzer.py against this robot's description. Placeholder
# values below MUST be replaced before `motus build`/`motus doctor` will
# pass; a fresh `motus create project` without --from leaves this here as
# a template.
/**:
  ros__parameters:
    home_pose: []          # TODO: one value per joint, radians
    marker_scale: 0.2
    publish_ee_path: True
    tool_type: none
    planning_base_link: base_link    # TODO: confirm against parsed URDF root
    planning_tip_link: tool0         # TODO: confirm against parsed URDF leaf

motion_planner:
  ros__parameters:
    vel_limits: []         # TODO
    acc_limits: []         # TODO
    jerk_limits: []        # TODO
    pos_limits_lo: []      # TODO
    pos_limits_hi: []      # TODO

kinematic_solver:
  ros__parameters:
    kinematic_solver_backend: pinocchio
