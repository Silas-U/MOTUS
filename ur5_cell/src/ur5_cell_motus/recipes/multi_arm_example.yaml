recipe_id: multi_arm_example
# Generated by `motus cell add-arm`. Every arm homes, reaches out and comes back;
# the reach steps share the resource `shared_zone`, so the arms take turns there.
# Poses are in EACH ARM'S OWN BASE FRAME (not the world frame) and are a starting
# point sized from this robot's reach -- tune them to your robot, tool and scene.
# `wait` steps keep each arm's moves in separate runs so the lock is held only
# while an arm is actually in the shared zone.

steps:

- id: home_arm1
  type: move
  arm_id: arm1
  traj_method: js
  traj_type: scurve
  target_pose: {x: 0.463, y: 0.0, z: 0.417, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: []

- id: pause_arm1
  type: wait
  duration_sec: 0.5
  depends_on: [home_arm1]

- id: reach_arm1
  type: move
  arm_id: arm1
  traj_method: js
  traj_type: scurve
  resources: [shared_zone]
  target_pose: {x: 0.463, y: 0.231, z: 0.292, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: [pause_arm1]

- id: pause2_arm1
  type: wait
  duration_sec: 0.5
  depends_on: [reach_arm1]

- id: return_arm1
  type: move
  arm_id: arm1
  traj_method: js
  traj_type: scurve
  target_pose: {x: 0.463, y: 0.0, z: 0.417, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: [pause2_arm1]

- id: home_arm2
  type: move
  arm_id: arm2
  traj_method: js
  traj_type: scurve
  target_pose: {x: 0.463, y: 0.0, z: 0.417, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: []

- id: pause_arm2
  type: wait
  duration_sec: 0.5
  depends_on: [home_arm2]

- id: reach_arm2
  type: move
  arm_id: arm2
  traj_method: js
  traj_type: scurve
  resources: [shared_zone]
  target_pose: {x: 0.463, y: -0.231, z: 0.292, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: [pause_arm2]

- id: pause2_arm2
  type: wait
  duration_sec: 0.5
  depends_on: [reach_arm2]

- id: return_arm2
  type: move
  arm_id: arm2
  traj_method: js
  traj_type: scurve
  target_pose: {x: 0.463, y: 0.0, z: 0.417, qx: 1.0, qy: 0.0, qz: 0.0, qw: 0.0}
  depends_on: [pause2_arm2]

