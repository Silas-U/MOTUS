# Generated by Motus Builder. Controller NAMES below (joint_state_broadcaster,
# arm_controller) are not arbitrary -- robokpy_controller's arm.launch.py
# spawns controllers by these exact names. Do not rename them here without
# also changing arm.launch.py's spawner arguments.
#
# Every top-level key is prefixed /**/ -- the ROS2 node-namespace wildcard,
# same convention robokpy_controller's own built-in controllers.yaml files
# already use (see e.g. ur5e_robotiq_85_gripper_controllers.yaml) and the
# same one this function's OWN robot_yaml output above uses for /**:.
# Without it a top-level key like `controller_manager:` only matches an
# UNNAMESPACED node -- arm.launch.py always launches under a per-arm
# namespace (e.g. /arm1/controller_manager), so a bare key silently never
# matches at all. Confirmed against a real launch: every controller failed
# identically with "'type' param was not defined", including
# joint_state_broadcaster, which has nothing gripper/robot-specific about
# it -- that uniformity is what pointed at a namespace-matching problem
# rather than anything controller-specific.
/**/controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**/joint_state_broadcaster:
  ros__parameters: {}

/**/arm_controller:
  ros__parameters:
    joints:
      - joint2_to_joint1
      - joint3_to_joint2
      - joint4_to_joint3
      - joint5_to_joint4
      - joint6_to_joint5
      - joint6output_to_joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
