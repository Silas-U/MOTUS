/**:
  ros__parameters:
    home_pose: [1.5697, -2.0535, 1.9318, -1.4490, -1.5708, 0.0]
    marker_scale: 0.2
    publish_ee_path: True
    tool_type: robotiq_85
    planning_base_link: world
    planning_tip_link: tcp

motion_planner:
  ros__parameters:
   # UR5e — Industrial Speed Profile

    # All joints at 180°/s = π rad/s hardware max
    vel_limits:   [3.14, 3.14, 3.14, 3.14, 3.14, 3.14]

    # Aggressive but stable accelerations (rad/s²)
    # Base/shoulder are heavier → slightly lower; wrist joints can snap faster
    acc_limits:   [10.0, 10.0, 12.0, 12.0, 15.0, 15.0]

    # Higher jerk for snappier starts/stops (rad/s³)
    jerk_limits:  [100.0, 100.0, 150.0, 150.0, 200.0, 200.0]

    # Full UR5e joint range — FIX: elbow was limited to ±π, should be ±2π
    # Wrist 3 is mechanically unlimited; ±2π is the safe planner convention
    pos_limits_lo: [-6.2832, -6.2832, -6.2832, -6.2832, -6.2832, -6.2832]
    pos_limits_hi: [ 6.2832,  6.2832,  6.2832,  6.2832,  6.2832,  6.2832]

kinematic_solver:
  ros__parameters:
    kinematic_solver_backend: pinocchio
