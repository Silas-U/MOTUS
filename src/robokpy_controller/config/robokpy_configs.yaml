/**:
  ros__parameters:

    home_pose: [1.5697, -2.0535, 1.9318, -1.4490, -1.5708, 0.0]
    world_frame: world
    planning_base_link: world
    planning_tip_link: tcp

motion_planner:
  ros__parameters:

    vel_limits: [3.14, 3.14, 3.14, 3.14, 3.14, 3.14]
    acc_limits: [1.57, 1.57, 1.57, 1.57, 1.57, 1.57]
    pos_limits_lo: [-6.28, -6.28, -3.14, -6.28, -6.28, -6.28]
    pos_limits_hi: [ 6.28,  6.28,  3.14,  6.28,  6.28,  6.28]
    default_traj_type: lspb
    default_traj_method: js
    default_speed_factor: 1.0
    default_duration_per_segment: 1.0
    default_dt: 0.04
    default_blend_radius: 0.0
    default_n_samples: 50
    default_n_blend: 0
    enable_limit_check: True
    enable_continuity_check: True
    abort_on_limit_violation: False
    mask: [1, 1, 1, 1, 1, 1]

kinematic_solver:
  ros__parameters:

    mask: [1, 1, 1, 1, 1, 1]
    control_rate_hz: 50.0
    pose_rate_limit_hz: 50.0

# motion_controller section REMOVED — that node no longer exists.
# Its JTC-driving role moved into motion_planner's ExecuteMotion action
# server (which already reads its own params above); its live-jog-relay
# role moved into virtual_jog_relay (declares no parameters).

robot_state_manager:
  ros__parameters:
    publish_rate_hz: 50.0
    state_timeout_s:  1.0
    # NOTE: robot_state_manager.py currently hardcodes a 0.02s (50Hz) timer
    # and never reads either of these two parameters — flagging as a
    # pre-existing gap, not something changed for this redesign. Changing
    # these values in this file currently has no effect until the node
    # itself is updated to call get_parameter() for them.

robot_state_interface_virtual:
  ros__parameters:
    publish_rate_hz: 50.0

robot_command_server:
  ros__parameters:
    default_gripper_tool_id: gripper_1