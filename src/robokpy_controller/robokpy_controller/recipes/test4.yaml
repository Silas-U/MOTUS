  recovery: retry
  max_retries: 2
  depends_on: [descend_pick_a_1]

- id: retract_a_1
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: 0.12, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [grip_close_a_1]

- id: traverse_to_b_1
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.40, y: -0.35, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [retract_a_1]

- id: descend_place_b_1
  type: move
  traj_method: ts
  target_pose:
