    {x: 0.48, y: 0.08, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [grip_close_a_4]

- id: traverse_to_b_4
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.40, y: -0.35, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [retract_a_4]

- id: descend_place_b_4
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: -0.35, z: 0.1257, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.0
  depends_on: [traverse_to_b_4]

- id: release_b_4
  type: tool
  tool_id: grasp_attach_1
  command: release
  recovery: retry
  max_retries: 2
  depends_on: [descend_place_b_4]

- id: retract_b_4
  type: move
  traj_method: ts
  target_pose:
    {x: 0.40, y: -0.35, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [release_b_4]

# ============================================================================
# CUBE 1 — red, small, yaw=0° — picked 3rd, placed on cube 4
# ============================================================================

- id: traverse_to_a_1
  type: move
  traj_method: js
  traj_type: scurve
  target_pose:
    {x: 0.40, y: 0.12, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  blend_radius: 0.08
  depends_on: [retract_b_4]

- id: descend_pick_a_1
  type: move
