  traj_type: scurve
  target_pose:
    {x: 0.45, y: 0.00, z: 0.45, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
  depends_on: [retract_b_2]

- id: despawn_target_1
  type: spawn
  operation: despawn
  from_spawn_step: spawn_target_1
