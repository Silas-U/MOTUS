recipe_id: pick_place_reorient_v1

# Orientation convention: qx=0,qy=1,qz=0,qw=0 is tool-down (matches all
# earlier recipes). The two reorientation quaternions below were derived
# via quaternion multiplication (Hamilton product), not rendered — verify
# the actual resulting tool orientation in RViz before trusting them for
# anything physical:
#   yaw90   (90 deg about world Z from tool-down): qx=-0.7071, qy=0.7071, qz=0.0, qw=0.0
#   pitch90 (90 deg about world Y from tool-down, tool axis -> world +X,
#            i.e. a horizontal approach instead of top-down):
#            qx=0.0, qy=0.7071, qz=0.0, qw=-0.7071

steps:

  # ================= CYCLE 1: yaw reorientation transfer =================
  # Pick top-down at P1, place at B1 rotated 90 deg about the vertical axis
  # (e.g. aligning a rectangular part into a rotated slot).

  - id: traverse_to_p1
    type: move
    traj_method: js
    target_pose: {x: 0.35, y: 0.20, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: []

  - id: descend_pick_p1
    type: move
    traj_method: ts
    target_pose: {x: 0.35, y: 0.20, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [traverse_to_p1]

  - id: grip_close_p1
    type: tool
    tool_id: gripper_1
    command: close
    depends_on:
      - {progress: descend_pick_p1, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_p1
    type: move
    traj_method: ts
    target_pose: {x: 0.35, y: 0.20, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_close_p1]

  # Position AND orientation both change here — the tool rotates 90 deg
  # about the vertical axis while traversing to the place station.
  - id: traverse_reorient_to_b1
    type: move
    traj_method: js
    target_pose: {x: 0.35, y: -0.20, z: 0.30, qx: -0.7071, qy: 0.7071, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 0.8
    depends_on: [retract_p1]

  - id: descend_place_b1
    type: move
    traj_method: ts
    target_pose: {x: 0.35, y: -0.20, z: 0.15, qx: -0.7071, qy: 0.7071, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [traverse_reorient_to_b1]

  - id: grip_open_b1
    type: tool
    tool_id: gripper_1
    command: open
    depends_on:
      - {progress: descend_place_b1, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_b1
    type: move
    traj_method: ts
    target_pose: {x: 0.35, y: -0.20, z: 0.30, qx: -0.7071, qy: 0.7071, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_open_b1]

  # ================= CYCLE 2: pitch reorientation transfer =================
  # Pick top-down at P2, then approach HORIZONTALLY to insert into a
  # vertical hole at station C2 — tool axis goes from pointing down to
  # pointing along world +X. Approach/insert points differ along X since
  # that's now the tool's own approach axis.

  - id: traverse_to_p2
    type: move
    traj_method: js
    target_pose: {x: 0.50, y: 0.20, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 1.0
    depends_on: [retract_b1]

  - id: descend_pick_p2
    type: move
    traj_method: ts
    target_pose: {x: 0.50, y: 0.20, z: 0.15, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.5
    depends_on: [traverse_to_p2]

  - id: grip_close_p2
    type: tool
    tool_id: gripper_1
    command: close
    depends_on:
      - {progress: descend_pick_p2, threshold: 0.85}
    recovery: retry
    max_retries: 2

  - id: retract_p2
    type: move
    traj_method: ts
    target_pose: {x: 0.50, y: 0.20, z: 0.30, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.6
    depends_on: [grip_close_p2]

  # Reorient to the horizontal-approach pose, staged back from the hole
  # along the tool's new approach axis (+X).
  - id: traverse_reorient_to_c2
    type: move
    traj_method: ts
    target_pose: {x: 0.65, y: -0.10, z: 0.20, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.03
    speed_scale: 0.6
    depends_on: [retract_p2]

  - id: insert_c2
    type: move
    traj_method: ts       # movel — straight-line insertion along the tool's approach axis
    target_pose: {x: 0.72, y: -0.10, z: 0.20, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.3
    depends_on: [traverse_reorient_to_c2]

  - id: grip_open_c2
    type: tool
    tool_id: gripper_1
    command: open
    depends_on:
      - {progress: insert_c2, threshold: 0.9}
    recovery: retry
    max_retries: 2

  - id: retract_c2
    type: move
    traj_method: ts       # straight back out along the same approach axis
    target_pose: {x: 0.65, y: -0.10, z: 0.20, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.02
    speed_scale: 0.5
    depends_on: [grip_open_c2]

  # Return to a standard tool-down neutral staging pose.
  - id: return_to_neutral
    type: move
    traj_method: ts
    target_pose: {x: 0.45, y: 0.0, z: 0.35, qx: 0.0, qy: 1.0, qz: 0.0, qw: 0.0}
    blend_radius: 0.0
    speed_scale: 0.8
    depends_on: [retract_c2]

  - id: cycle_settle
    type: wait
    duration_sec: 0.5
    depends_on: [retract_c2]


